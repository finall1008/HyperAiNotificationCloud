name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' 'build-tools;35.0.0'

      - name: Restore signing key
        env:
          RELEASE_JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}
        run: |
          : "${RELEASE_JKS_BASE64:?Missing RELEASE_JKS_BASE64 secret}"
          umask 077
          printf '%s' "$RELEASE_JKS_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          HYPERAI_SIGNING_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          : "${HYPERAI_SIGNING_PASSWORD:?Missing RELEASE_STORE_PASSWORD secret}"
          ./build.sh

      - name: Verify release certificate and checksum
        env:
          EXPECTED_CERT_SHA256: 33f92075e81fc19c93bb58f83c0db334888e635926ef400849569b91f86102f5
        run: |
          APK=(dist/*-release.apk)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "${APK[0]}" \
            > "$RUNNER_TEMP/apk-certificate.txt"
          grep -Fx "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" \
            "$RUNNER_TEMP/apk-certificate.txt"
          cd dist
          sha256sum ./*-release.apk > "$(basename "${APK[0]}").sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: HyperAiNotificationCloud-release
          path: |
            dist/*-release.apk
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*-release.apk dist/*.sha256

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
